[workspace]
resolver = "2"
members = ["crates/engine", "crates/game", "crates/preview", "crates/preview-window", "apps/mapview", "apps/audit", "apps/studio"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1          # the preview math is meaningless unoptimised

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
